<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Calculator - Practical 5.1</title>
    <link rel="stylesheet" href="grade-calculator.css" />
  </head>
  <body>
    <div class="container">
      <h1>Newgate University</h1>
      <h2>Interactive Grade Calculator</h2>

      <div class="calculator-form">
        <!-- Course Title Input -->
        <div class="input-group">
          <label for="courseTitle">Course Title:</label>
          <input
            type="text"
            id="courseTitle"
            placeholder="e.g. IFT 203 - Web Technologies"
          />
        </div>

        <!-- Score Input -->
        <div class="input-group">
          <label for="score">Enter Score (0 - 100):</label>
          <input
            type="number"
            id="score"
            placeholder="e.g. 75"
            min="0"
            max="100"
          />
        </div>

        <button type="button" class="btn-calculate" onclick="calculateGrade()">
          Calculate Grade
        </button>
      </div>

      <!-- Single Calculation Output Target -->
      <div id="result" class="result-box"></div>

      <!-- Automated System Test Section -->
      <div class="test-suite-section">
        <p class="test-hint">Try: 85, 72, 64, 51, 39</p>
        <button type="button" class="btn-test-all" onclick="runSystemTests()">
          Run All 5 Tests
        </button>

        <h3 class="test-results-heading">Test Results:</h3>
        <div id="testResultsContainer" class="test-results-list"></div>
      </div>
    </div>

    <script src="grade-calculator.js"></script>
  </body>
</html>
